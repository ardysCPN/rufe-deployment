version: "3.9"
services:
  postgres:
    image: postgis/postgis:15-3.4
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rufe_network
  backend:
    build:
      context: https://github.com/ardysCPN/rufe-backend.git
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - postgres
    environment:
      # Conexión INTERNA entre contenedores
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      APP_DATALOADER_ENABLED: ${APP_DATALOADER_ENABLED}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS} # (Para que el sistema intente inicializar/validar).
      APP_DATALOADER_FORCE_RESET: ${APP_DATALOADER_FORCE_RESET} # (Por defecto. Ponlo en true solo cuando quieras regenerar todo).
      APP_DATALOADER_I_AM_SURE: ${APP_DATALOADER_I_AM_SURE} # (El "seguro" adicional contra pérdida de datos reales).
      # NUEVA PROPIEDAD: Directorio de almacenamiento de evidencias
      APP_STORAGE_LOCAL_DIR: ${APP_STORAGE_LOCAL_DIR:-/var/lib/rufe/evidences}
    volumes:
      # Volumen para persistencia de imágenes y evidencias
      - rufe_evidences:/var/lib/rufe/evidences
    networks:
      - rufe_network
  frontend:
    build:
      context: https://github.com/ardysCPN/rufe-front.git
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    environment:
      # El front llama a su propio servidor de Node
      API_URL: ${API_URL}
      # Nombre del servicio backend en la red de Docker
      INTERNAL_BACKEND_URL: http://backend:8080
      PORT: 4000
    networks:
      - rufe_network
volumes:
  postgres_data:
  rufe_evidences: # Declaración del volumen para evidencias
networks:
  rufe_network:
    driver: bridge
